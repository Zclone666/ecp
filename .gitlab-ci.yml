image: docker:stable
variables:
    PROJECT: "ecp2front"
    PORT: 9009

stages:
  - Build image
  - Docker stop
  - Docker run

docker build:
  stage: Build image
  tags: 
  - docker
  script:
  - docker build --force-rm -t $PROJECT ./

docker stop:
  stage: Docker stop
  tags: 
    - docker
  script:
    - docker stop $PROJECT || true

docker run:
  stage: Docker run
  tags: 
    - docker
  script:
    - docker run -d --rm -p 127.0.0.1:$PORT:80 --name $PROJECT $PROJECT